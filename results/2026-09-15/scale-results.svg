<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">SeatLayer stadium benchmark: 100K to 200K seats</title>
<desc id="desc">Median chart readiness and zoom performance across three desktop runs per venue. Local production build.</desc>
<rect width="1200" height="420" rx="24" fill="#0b1019"/>
<g font-family="Arial,sans-serif">
<text x="40" y="52" fill="#f9bc3c" font-size="18" font-weight="700">SEATLAYER PERFORMANCE</text>
<text x="40" y="99" fill="#fff" font-size="34" font-weight="700">Stadium scale, measured.</text>
<rect x="40" y="132" width="360" height="218" rx="16" fill="#161e2d" stroke="#2b3548"/>
<text x="64" y="169" fill="#b8c3d5" font-size="19">100,000 seats</text>
<text x="64" y="229" fill="#fff" font-size="46" font-weight="700">1.02 s</text>
<text x="64" y="258" fill="#b8c3d5" font-size="17">chart ready</text>
<text x="64" y="311" fill="#65dbb3" font-size="21" font-weight="700">58.6 FPS zoom · 60 FPS pan</text>
<rect x="420" y="132" width="360" height="218" rx="16" fill="#161e2d" stroke="#2b3548"/>
<text x="444" y="169" fill="#b8c3d5" font-size="19">150,000 seats</text>
<text x="444" y="229" fill="#fff" font-size="46" font-weight="700">1.44 s</text>
<text x="444" y="258" fill="#b8c3d5" font-size="17">chart ready</text>
<text x="444" y="311" fill="#65dbb3" font-size="21" font-weight="700">58.6 FPS zoom · 60 FPS pan</text>
<rect x="800" y="132" width="360" height="218" rx="16" fill="#161e2d" stroke="#2b3548"/>
<text x="824" y="169" fill="#b8c3d5" font-size="19">200,000 seats</text>
<text x="824" y="229" fill="#fff" font-size="46" font-weight="700">1.95 s</text>
<text x="824" y="258" fill="#b8c3d5" font-size="17">chart ready</text>
<text x="824" y="311" fill="#65dbb3" font-size="21" font-weight="700">57.6 FPS zoom · 60 FPS pan</text>
<text x="40" y="388" fill="#a8b4c8" font-size="15">15 Sep 2026 · Median of 3 runs per chart · Chrome 152 · 1280 × 720, DPR 2 · Local production build</text>
</g></svg>
